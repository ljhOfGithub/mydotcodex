prompt = "持续监控本线程博士申请邮件暂停状态，并自动整理老师真人回信、可用时间询问与明确日程。无有意义变化时保持静默。\n\n一、用户主动暂停发送（2026-10-24 Asia/Shanghai）\n用户已明确要求暂停所有邮件发送，之后由用户再次明确要求时才能恢复。主发送器 com.jihao.cs-phd-supervisors-mailer 与附件补发器 com.jihao.cs-phd-supervisors-attachment-corrections 当前都应保持 launchctl disabled、not_loaded，且不得存在 mail_scheduler.py 或 send_attachment_corrections.py 发送进程。不得启用、加载、启动、重启或以任何方式恢复发送；不得改写队列、账号状态、正文、收件人、凭据、附件或限流参数。\n暂停基线：events 最大 id=1105，最新事件为 2026-10-24T11:50:52+08:00 的 accepted；队列 accepted=999、blocked=2003、deferred=9、pending=659、uncertain=49。accepted 仅代表服务端接受，不代表收件端最终投递。若任一发送任务变为 enabled/loaded、出现发送进程、events>1105、队列因发送发生变化，立即通知；暂停状态完全不变时不要因 LaunchAgent 被禁用或卸载而报警。\n\n二、永久取消保护\nUSER_CANCELLED_UNIVERSITIES 必须永久排除上海纽约大学、宁波诺丁汉大学、昆山杜克大学、西交利物浦大学、香港中文大学（深圳）；86 条 cancelled_by_user:cooperative_university 必须保持 blocked，可发送 pending/deferred/leased=0。\n以下 9 条必须永久包含在 USER_CANCELLED_RECORD_IDS 且保持 blocked、last_error=cancelled_by_user:research_direction_mismatch、可发送状态=0：DLUT-COMP-073、CAS-SIAT-FULL-028、CAS-SIAT-FULL-056、CAS-SIAT-FULL-026、MUC-COMPUTING-016、USTC-6570580、SCUT-COMP-054、SCUT-COMP-061、FDU-COMP-126。历史 accepted、uncertain 和附件补发记录保持原状，绝不自动重发。\n\n三、每轮只读发送检查\n只读检查：\n- /Users/jackie/Library/Application Support/cs-phd-supervisors-mailer/runtime/mailer.sqlite3\n- /Users/jackie/Library/Application Support/cs-phd-supervisors-mailer/mailer-config.json\n- /Users/jackie/Library/Application Support/cs-phd-supervisors-mailer/materials/merged_materials.zip\n- runtime/mailer.stderr.log、runtime/corrections.stderr.log\n- 上述两个 LaunchAgent 及相关进程\n附件暂停基线：3821466 字节，SHA-256=5847d873e0822895ae7ce72dfa3522694d199d43729938c852dfe923bf1f9bb5。preflight_only=false，auth_pause_minutes=60。若取消保护失效、出现发送事件、账号状态异常、preflight_only=true、auth_pause_minutes不为60、附件大小/哈希变化或新的错误类型，立即通知。已知 corrections.stderr.log 会重复报告“主调度启用时必须开启 prioritize_attachment_corrections 门禁”；在内容仅重复且没有其他变化时保持静默。\n\n四、Outlook 收件箱强制检查\n每次运行必须实际只读查询 lijihao.jackie@outlook.com 收件箱并滚动回看过去72小时。Keychain 服务 cs-phd-mailer-graph-token 存放 JSON token bundle，必须解析 JSON 且仅用 access_token 作为 Bearer token，严禁把整段 JSON 当作 token。每轮核验 Graph /me 身份、Inbox HTTP状态、最新 receivedDateTime 和相对上轮新增数。未执行、非200、身份不匹配或增量无法确定时立即通知，不得声称无新老师回信。\n忽略自动回复、退信、通知和纯系统转发；主题“Outlook.com has blocked your message”或正文说明 daily message limit reached 归类为发送额度异常，不得写入导师回复字段。\n\n五、老师真人回信、Excel与日历\n将新真人回复与 /Users/jackie/Documents/research/cs-phd-supervisors/supervisors-all.xlsx 的 record_id、姓名、邮箱和邮件主题交叉匹配；仅唯一匹配时归档，歧义时通知并列候选，不猜测、不自动回复。\n工作表“导师与邮件草稿”回复列 Z:AG 为 reply_status、reply_received_at、reply_from、reply_subject、reply_category、reply_summary、reply_next_action、reply_content。reply_content 仅保留本次新增正文；summary与next_action用简体中文。检测到锁文件、恢复提示或 Excel 已打开但无可用连接时不得覆盖，只通知；关闭且无锁时先做单个时间戳备份再原子更新，并复核2张工作表、4748行、record_id唯一性和列标题。\n出现询问可用时间时立即提醒并标记待回复，不自动代答。\n老师真人邮件若包含会议、面试、电话、腾讯会议、Zoom或Teams，且日期与开始时间唯一确定并仍在未来，必须同轮在 macOS 系统日历按 Asia/Shanghai 创建并回读核对。老师单方面提出且用户未确认时标题用“待确认｜博士申请沟通｜学校｜老师”；已确认时用“博士申请沟通｜学校｜老师”。无结束时间默认1小时并在备注说明。按 record_id、开始时间、老师邮箱去重；过去日程不补建，立即通知监控漏记/已过期；歧义不创建；日历权限或写入失败立即通知。"
