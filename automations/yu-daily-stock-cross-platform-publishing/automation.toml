prompt = "每天执行 `白Yu观测` 股票市场信息跨平台发布流程。默认中文、事实优先、证据优先。当前日期和时区按 Asia/Shanghai 处理。\n\n用户已明确授权：这个 stock daily routine 每天运行，不只股票交易日；每次完成公开股票相关信息收集、公众号真实发布、小红书真实发布、抖音真实发布。不要停在草稿，除非遇到下面列出的硬性阻断。发布前仍必须完成证据、账号、排版、免责声明和平台状态校验。\n\n账号约定：\n- 公众号账号/品牌：`白Yu观测`。\n- 小红书账号/品牌：`白Yu观测`。\n- 抖音账号：`白宇`。\n- 内容品牌名统一写作 `白Yu观测`，中间无空格；只有抖音后台账号校验使用 `白宇`。\n\n本地路径：\n- 工作目录：`/Users/jackie/Documents/paper daily`\n- 公众号 API 仓库：`/Users/jackie/Documents/mediePlatform`\n- 报告输出根目录：`/Users/jackie/Documents/paper daily/reports`\n- 必须使用的 skills：\n  - `/Users/jackie/.codex/skills/stock-market-daily-signal-draft/SKILL.md`\n  - `/Users/jackie/.codex/skills/wechat-daily-signal-publisher/SKILL.md`\n  - `/Users/jackie/.codex/skills/xiaohongshu-daily-signal-publisher/SKILL.md`\n  - `/Users/jackie/.codex/skills/douyin-daily-signal-publisher/SKILL.md`\n  - `/Users/jackie/.codex/skills/daily-push-skill-improver/SKILL.md` only when a run exposes reusable process issues.\n\n内容范围：\n- 只做股票/市场公开信息整理，不混入计算机科研论文内容。\n- 每次选择一条主线，不做松散新闻堆砌。默认覆盖美股、中概/港股/A股相关外溢、主要指数/行业 ETF、利率、汇率、商品、公司财报/公告/监管文件、政策与宏观催化。\n- 每天都运行。交易日写当日市场信号；周末或休市日写 `休市版观察`：上一个交易日收盘、周内主线复盘、未来一周财报/宏观/政策/公司公告日历、海外或期货市场如有可验证数据、下一个交易日观察清单。\n- 严禁个性化投资建议、买卖指令、仓位建议、目标价、稳赚/抄底/逃顶等表达。必须保留免责声明：`仅为公开信息整理与研究笔记，不构成投资建议。`\n\n母版流程：\n1. 使用 `stock-market-daily-signal-draft` 生成当天股票市场母版稿和 sources notes。\n2. 必须核对市场状态：开盘、盘前、盘后、周末或假期。不要把休市日写成交易日行情。\n3. 所有市场/个股/行业主张必须有来源 URL、来源名称、时间戳、市场地区和数据延迟说明；解释必须区分事实与推断。\n4. 如果实时检索、行情、公告、财经新闻、API 或网络失败，停止正常发布，写失败 note，不要把旧数据包装成当天信号。\n5. 公众号标题、作者、封面、正文必须符合 `白Yu观测` 风格：冷静、证据清楚，不写营销话术。公众号正文必须是可读 HTML，不留下 raw `<ul>/<li>` 造成混乱圆点。\n6. 使用 `/Users/jackie/Documents/mediePlatform` 的既有 WeChat 能力创建/更新图文并执行真实发布；不要打印、保存或泄露 `.env`、AppSecret、access token、cookies、session 等敏感信息。\n7. 发布后记录真实发布结果：media_id/article_id/publish_id/URL/平台返回状态中能拿到的字段。若接口返回异步任务，轮询或记录可查询状态，不要只报告提交命令已运行。\n\n小红书流程：\n1. 以股票市场母版为 canonical source。小红书是同内容压缩版，不是平行改写。\n2. 保持标题关键词、章节顺序、事实主张、证据时间戳、风险反证、观察清单和免责声明。\n3. 生成 3:4 竖版 PNG 卡片，优先 1242 x 1656。卡片承载关键图表、市场主线、证据时间戳、催化日历和风险反证，不能做成空泛口号卡。\n4. 使用 `chrome:control-chrome` 打开 `https://creator.xiaohongshu.com/publish/publish?source=official`，确认页面账号显示 `白Yu观测` 后上传并真实发布。\n5. 如果 Chrome 要登录、验证码、二维码、2FA、账号切换或敏感确认，停止并提示用户手动处理；不要绕过验证。\n\n抖音流程：\n1. 以股票市场母版为 canonical source。抖音也是同内容压缩版，不是短视频营销稿。\n2. 使用 `/Users/jackie/.codex/skills/douyin-daily-signal-publisher/SKILL.md`。正文不能只用三段简介；必须保留市场状态、主线、关键证据、反证/风险、后续观察和免责声明。\n3. 优先发布图文作品；若网页端只暴露视频上传能力，则把同一组卡片合成为 9:16 slideshow MP4 并记录降级原因。\n4. 使用 `chrome:control-chrome` 打开 `https://creator.douyin.com/` 或 `https://creator.douyin.com/creator-micro/content/upload`，确认页面账号显示 `白宇` 后上传并真实发布。\n5. 如果 Chrome 要登录、验证码、二维码、2FA、实名/手机号/账号切换或敏感确认，停止并提示用户手动处理；不要绕过验证。\n\n硬性阻断：\n- 无法获取当前公开股票/市场信息，或所有关键数据都没有来源/时间戳。\n- 市场状态无法确认，尤其是周末/假期误判风险。\n- 公众号账号不是 `白Yu观测`，小红书账号不是 `白Yu观测`，或抖音账号不是 `白宇`。\n- 平台要求登录、验证码、扫码、2FA、实名/手机号确认、账号切换或敏感确认。\n- 微信 IP 白名单、access token、media upload、publish/freepublish/submit 接口失败。\n- 小红书或抖音文件上传、发布按钮、平台校验或审核前提交失败。\n- 内容校验命中旧品牌空格、缺少免责声明、raw HTML list tags、杂乱标点、个性化投资建议、过度网感标签，或正文和卡片明显偏离母版。\n\n验证和记录：\n- 每次结束前检查：`白Yu 观测` 旧空格写法、免责声明、raw HTML list tags、买卖/仓位/目标价/稳赚类建议词、过度网感标签、来源时间戳、市场状态、正文和卡片/视频内容偏离母版。\n- 记录 source notes：来源 URL、行情/公告/新闻时间戳、市场状态、公众号发布结果、小红书发布结果、抖音发布结果、发布时间、任何失败源。\n- 最终回复用户：公众号发布状态、小红书发布状态、抖音发布状态、本地产物路径、验证结果、如未发布则说明具体阻断。"
