prompt = "【抖音永久暂停｜最高优先级】自 2026-10-18 起，直到用户以后明确说“恢复抖音”，本自动化的所有时段、同日补漏、历史失败恢复、修复和验证均不得为抖音生成、校验或适配正文、单张 3:4 PNG、PDF 页面集、slideshow 或其他本地产物，不得读取或执行抖音发布技能，不得创建或消费 douyin job、bundle、trigger，不得操作浏览器/CDP、上传、编辑、保存草稿、提交、发布、验证、重试或恢复。计算机科研的抖音格继续记录 `not-applicable-by-user`；金融观察的抖音格统一记录 `publication-paused-by-user` 且 actions=0；这不是遗漏、失败或待恢复任务。已有本地文件、草稿、作品、URL、ID、result/state 仅作为历史事实保留，不删除、不修改、不自动补发。只有用户明确恢复抖音，且 skill、automation、prepare-trigger、worker、platform-publisher CLI 五层门槛同步解除后，才允许任何抖音动作。本门槛覆盖并优先于下文所有抖音适配、触发、发布、补漏、登录恢复、浏览器、验证和重试文字。\n\n【微信永久暂停｜最高优先级】自 2026-09-30 起，直到用户以后明确说“恢复微信”或“恢复公众号”，本自动化的所有时段、同日补漏、历史失败恢复、修复和验证均不得为微信公众号/135生成、校验或适配 HTML、封面、预览等本地产物，不得读取或执行微信发布技能，不得创建或消费 wechat135 job、bundle、trigger，不得调用微信 API，不得操作浏览器、135编辑器或微信后台，不得上传、编辑、同步、保存草稿、预览、群发、发布、验证、重试或恢复。所有公众号格统一记录 `publication-paused-by-user` 且 actions=0；这不是遗漏、失败或待恢复任务。已有本地文件、草稿、URL、ID、result/state 仅作为历史事实保留，不删除、不修改、不自动补发。只有用户明确恢复微信/公众号，且 skill、automation、prepare-trigger、worker、platform-publisher CLI 五层门槛同步解除后，才允许任何微信动作。本门槛覆盖并优先于下文所有公众号适配、触发、发布、补漏、登录恢复、API、验证和重试文字。\n\n【知乎永久暂停｜最高优先级】自 2026-09-28 起，直到用户以后明确说“恢复知乎”，本自动化的所有时段、同日补漏、历史失败恢复、修复和验证均不得为知乎生成、校验或适配 Markdown/DOCX 等本地产物，不得读取或执行知乎技能，不得创建或消费知乎 job、bundle、trigger，不得操作浏览器、导入、编辑、填写声明、保存草稿、提交、更新、验证公开页、重试或恢复。所有知乎格统一记录 `publication-paused-by-user` 且 actions=0；这不是遗漏、失败或待恢复任务。已有本地文件、公开文章、URL、result/state 仅作为历史事实保留，不删除、不修改、不自动补发。只有用户明确恢复知乎，且 skill、automation、prepare-trigger、worker、platform-publisher CLI 五层门槛同步解除后，才允许任何知乎动作。本门槛覆盖并优先于下文所有知乎适配、触发、发布、补漏、修复、验证和重试文字。\n\n【小红书立即暂停｜最高优先级】自 2026-09-17 起，直到用户明确说“恢复小红书”，本自动化的所有时段、同日补漏和历史失败恢复均不得为小红书生成/校验/适配本地产物，不得读取或执行小红书技能，不得创建/消费小红书 job、bundle、trigger，不得操作浏览器、上传、编辑、填写话题/声明、保存草稿、定时、提交、重试或恢复。所有小红书格统一记录 `publication-paused-by-user` 且 actions=0。已有草稿/页面/结果仅作为历史事实保留，不删除、不自动补发。本门槛覆盖下文所有小红书人工提交准备、平台适配、触发、补漏和重试文字；抖音、公众号与知乎均按各自永久暂停门槛执行。\n\n【平台内容范围｜最高优先级】每日仍生成 7 篇计算机科研单篇全文深读和 5 篇金融市场观察，共 12 篇独立文章；平台动作严格按下表执行：\n- 计算机科研：公众号、小红书、知乎与B站为 `publication-paused-by-user`；抖音为 `not-applicable-by-user`。\n- 金融观察：抖音、小红书、知乎与B站为 `publication-paused-by-user`；公众号为 `not-applicable-by-user`。\n不适用或暂停的格子不是遗漏、失败或待恢复任务，必须保持本地产物/job/trigger/browser/upload/提交/重试为 0。\n\n【B站永久暂停】任何新稿、当日补漏、历史失败、编辑、验证和 FIFO 队首都不得生成或适配 B站产物，不得创建 B站 job/bundle/trigger，不得启动浏览器、检查管理页、上传、保存、提交、重试或占用额度。`/Users/jackie/Documents/paper daily/reports/bilibili/publish-queue.md` 只作为历史证据冻结保留：不得追加、删除、重排、消费、验证或补发。只有用户以后明确恢复 B站，且 skill、automation、prepare-trigger、worker、adapter 五层门槛同步解除后，才允许动作。\n\n【公众号永久暂停】科研与金融均不生成公众号 HTML、封面、预览或图片副本，不创建或消费 wechat135 job/bundle/trigger，不读取微信发布技能，不调用微信 API，不运行 135/微信后台浏览器动作、草稿保存、发布、验证或恢复。历史草稿、失败页、ID 和结果只作历史状态保留；暂停期不补发。\n\n【抖音永久暂停】计算机科研的抖音格维持 `not-applicable-by-user` 且 actions=0；金融观察的抖音格统一为 `publication-paused-by-user` 且 actions=0。科研与金融均不得生成或校验抖音正文、PNG、PDF 页面集、slideshow 等本地产物，不得创建或消费 job/bundle/trigger，不得进行浏览器/CDP、上传、草稿、提交、发布、验证、重试或历史恢复。已有抖音产物、草稿、作品、URL、ID 和 result/state 只作历史事实保留，不删除、不修改、不自动补发。\n\n【小红书暂停】科研与金融均不生成小红书稿件或图片副本，不创建小红书 job/bundle/trigger，不读取小红书技能，不运行浏览器准备、草稿保存、人工提交交接或任何恢复。已有 ready/草稿/失败记录只作历史状态保留；暂停期不补发。仅用户明确说“恢复小红书”后再重新审查技能、自动化及发布器门禁。\n\n【时段与内容】Asia/Shanghai 每日 08:00、10:00、13:00、15:00、17:00、18:00、22:00 运行。08:00、10:00、13:00、18:00、22:00 各生成 1 篇科研和 1 篇金融；15:00、17:00 各生成 1 篇科研。未来未到点时段不得提前生成。7 篇科研不得重复论文、主线或计数；5 篇金融主线互不重复。\n\n每次运行完整读取并遵循：\n- `/Users/jackie/.codex/skills/computer-research-signal-draft/SKILL.md`\n- `/Users/jackie/.codex/skills/financial-market-signal-draft/SKILL.md`\n- `/Users/jackie/.codex/skills/stock-market-daily-signal-draft/SKILL.md`\n- 微信永久暂停期间不得读取或执行微信发布技能。\n- 小红书暂停期间不得读取或执行小红书技能。\n- 抖音永久暂停期间不得读取或执行抖音发布技能。\n- 知乎永久暂停期间不得读取或执行知乎技能。\nB站暂停期间不得为日常流程读取或执行 B站技能。仅当运行暴露可复用流程问题时使用 `daily-push-skill-improver`。\n\n【科研证据】每篇只深读 1 篇论文，必须获得并阅读 PDF 或 HTML 全文，覆盖 abstract、introduction、method/system design、experiments/evaluation、limitations/conclusion 和关键 figures/tables。只有摘要/列表页时标记 `abstract-only`/`listing-only` 并停止所有适用平台动作。始终读完整 PDF；平台图片仅上传已验证上限内的有序前缀，不拆第二篇。source notes 记录 `pdf_pages`、`uploaded_pages`/`embedded_pages`、`omitted_pages`、`visual-truncated`，不得把截断图集称为全文。\n\n【金融证据与政策】每篇从当日 `https://www.jin10.com/` 或 7×24 流发现独立候选，记录具体 URL、页面北京时间、原文和抓取时间；金十为 B 级二手来源，尽量回查官方原始来源后才可标 A。金十不可用或无合规新信号时明确失败，不用旧内容或其他来源静默补位。候选阶段与最终上传前运行 `node /Users/jackie/.codex/skills/financial-market-signal-draft/scripts/check_finance_policy.mjs <files...>`。加密货币/虚拟币以及非法货币服务、违规借贷套现、POS、场外配资、洗钱跑分、代理退保、荐股荐基、推荐软件/群、违规佣金等命中时整篇 `policy-rejected`，放弃该主题并换新候选，不得删词规避。不得给个性化买卖、仓位、目标价或产品推荐。\n金融视觉严格为 1 张 1242x1656 纯文字 3:4 PNG，暖白底、小号品牌与时间、事实标题、2-4 段正文、来源时间行；禁止图标、图表、K线、箭头、照片、插画、数据块、风险框和多图轮播。抖音永久暂停期间不得生成该 PNG；仅在用户明确恢复抖音且全部门槛解除后才适用。\n\n【母版与适配】每篇先生成独立母版与 source notes，并显式写入顶层 `contentType=research|finance`。科研与金融均只生成独立母版与 source notes，不做任何平台适配。知乎永久暂停，不生成知乎 Markdown、DOCX、图片副本、job 或任何校验产物。品牌精确为 `白Yu观测`。科研正文保留图怎么读、方法、评分/实验、限制和后续；金融正文保留来源时间戳、反证、风险与非推荐表述。\n\n【无人值守浏览器边界】抖音、微信、小红书、知乎与B站全部暂停，Scheduled 任务不得为任何平台调用 `/Users/jackie/Documents/paper daily/automation/local-publisher/prepare-trigger.cjs`，不得创建或消费任何平台 job、bundle、trigger，不得直接或间接操作浏览器/CDP；`com.openai.codex.baiyu-local-publisher` LaunchAgent 不得启动或续跑本自动化的任何平台任务。允许创建的平台 trigger=`none`。不得因历史 result/state、登录状态或失败任务恢复任何平台动作；所有平台 browser/upload/submit/verify/retry actions=0。\n\n【同日全量补漏】每次启动第一步建立当天所有已到时段矩阵，读取 automation memory、总台账、run report、source notes 以及仅作历史证据的 result/state/queue/processing。矩阵不包含任何可执行平台动作；抖音科研为终态 N/A，金融抖音以及公众号、小红书、知乎与全部 B站为 paused，绝不补做。按最早内容缺口优先：内容缺失时为原时段生成新独立文章并记录计划时段、实际时间和 `same-day-catch-up`；已有内容则沿用同一文章。所有平台暂停或不适用，不恢复任何历史 job/ID/result/state，不创建 trigger，不操作编辑器或管理页。代理、DNS/SSL、连接重置、超时、429/5xx 的递增重试仅适用于获取当日合规内容证据，不得用于平台发布链路；全文不足或证据不足为内容硬阻断。不得补发任何暂停平台的历史任务。\n\n【真实状态与收尾】草稿、上传、点击、trigger、历史记录均不能包装成发布。公众号、小红书、知乎、B站与金融抖音统一记 `publication-paused-by-user` 且 actions=0；科研抖音记 `not-applicable-by-user` 且 actions=0。逐篇记录本地产物、验证结果和具体阻断。结束前扫描旧品牌、错误免责声明、raw HTML、重复正文、过度网感标签、金融违规和平台偏离；确认本轮平台 trigger=0，平台 queue/processing 无新增或本轮遗留。\n\n每次结束无论成功或失败，先写 run report、source notes、当日台账和 automation memory。\n每次运行还要将 thread_source=automation 且最后更新超过 72 小时的已结束任务设为 archived；不归档 active/running、当前任务或 72 小时内任务，不删除任务或文件，记录候选数、成功数、失败数。\n\n【工具完成状态门槛】工具或命令返回 `status=completed` 或明确 `exitCode` 时，表示该调用已经结束，必须立即读取现有输出并推进下一步，不得继续等待或重复同一检索。只有返回 `sessionId`、`cellId`、`Script running` 或其他明确的持续运行句柄时才允许等待；等待结束后也要先检查最新状态再决定是否继续。\n\n【公众号登录与恢复禁用】微信永久暂停期间不得点击登录、恢复会话、检查编辑器或保留页，不得以任何方式启动或续跑公众号 job。"
